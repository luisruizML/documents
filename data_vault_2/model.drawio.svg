<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%" style="background-color: #0f172a; font-family: system-ui, -apple-system, sans-serif;">
  <!-- Title -->
  <text x="600" y="50" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="bold">Enhanced Entity-Relationship (EER) Model</text>
  <text x="600" y="80" text-anchor="middle" fill="#94a3b8" font-size="13" font-style="italic">Source Tables: SRC_Department, SRC_Employee, SRC_WorkOn, SRC_Project</text>

  <!-- Legend -->
  <g transform="translate(880, 130)">
    <rect width="240" height="120" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="120" y="24" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="bold">EER Legend</text>
    <text x="15" y="48" fill="#c7d2fe" font-size="11" font-weight="bold">🔑 Primary Key (PK)</text>
    <text x="15" y="72" fill="#a7f3d0" font-size="11" font-weight="bold">🔗 Foreign Key (FK)</text>
    <text x="15" y="96" fill="#f0abfc" font-size="11" font-weight="bold">🔑🔗 Composite PK &amp; FK</text>
  </g>

  <!-- Connector: SRC_Employee (FK) -> SRC_Department (PK) -->
  <path d="M 80 500 L 40 500 L 40 210 L 80 210" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="none"/>
  <rect x="25" y="340" width="30" height="20" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="40" y="354" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="bold">1:M</text>

  <!-- Connector: SRC_WorkOn (Emp_ID) -> SRC_Employee (Emp_ID) -->
  <path d="M 480 510 L 320 434" fill="none" stroke="#a855f7" stroke-width="2.5"/>
  <rect x="385" y="460" width="30" height="20" rx="4" fill="#0f172a" stroke="#a855f7" stroke-width="1"/>
  <text x="400" y="474" text-anchor="middle" fill="#c084fc" font-size="11" font-weight="bold">M:1</text>

  <!-- Connector: SRC_WorkOn (Project_ID) -> SRC_Project (Project_ID) -->
  <path d="M 720 546 L 880 480" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
  <rect x="785" y="500" width="30" height="20" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="800" y="514" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="bold">M:1</text>

  <!-- Table 1: SRC_Department -->
  <g transform="translate(80, 140)">
    <rect width="240" height="144" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2.5"/>
    <path d="M 0 0 L 240 0 L 240 36 L 0 36 Z" fill="#3b82f6"/>
    <text x="120" y="23" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">SRC_Department</text>
    
    <rect x="0" y="36" width="240" height="36" fill="#1e1b4b"/>
    <text x="12" y="59" fill="#c7d2fe" font-size="12" font-weight="bold">🔑 Dep_ID [PK]</text>
    
    <rect x="0" y="72" width="240" height="36" fill="#0f172a"/>
    <text x="24" y="95" fill="#e2e8f0" font-size="12">Dep_Name</text>
    
    <rect x="0" y="108" width="240" height="36" fill="#1e293b"/>
    <text x="24" y="131" fill="#e2e8f0" font-size="12">Dep_Code</text>
  </g>

  <!-- Table 2: SRC_Employee -->
  <g transform="translate(80, 380)">
    <rect width="240" height="288" rx="8" fill="#1e293b" stroke="#6366f1" stroke-width="2.5"/>
    <path d="M 0 0 L 240 0 L 240 36 L 0 36 Z" fill="#6366f1"/>
    <text x="120" y="23" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">SRC_Employee</text>
    
    <rect x="0" y="36" width="240" height="36" fill="#1e1b4b"/>
    <text x="12" y="59" fill="#c7d2fe" font-size="12" font-weight="bold">🔑 Emp_ID [PK]</text>
    
    <rect x="0" y="72" width="240" height="36" fill="#0f172a"/>
    <text x="24" y="95" fill="#e2e8f0" font-size="12">Name</text>
    
    <rect x="0" y="108" width="240" height="36" fill="#1e293b"/>
    <text x="24" y="131" fill="#e2e8f0" font-size="12">Gender</text>
    
    <rect x="0" y="144" width="240" height="36" fill="#0f172a"/>
    <text x="24" y="167" fill="#e2e8f0" font-size="12">Birdth_Date</text>
    
    <rect x="0" y="180" width="240" height="36" fill="#1e293b"/>
    <text x="24" y="203" fill="#e2e8f0" font-size="12">Adress</text>
    
    <rect x="0" y="216" width="240" height="36" fill="#0f172a"/>
    <text x="24" y="239" fill="#e2e8f0" font-size="12">City</text>
    
    <rect x="0" y="252" width="240" height="36" fill="#064e3b"/>
    <text x="12" y="275" fill="#a7f3d0" font-size="12" font-weight="bold">🔗 Dep_ID [FK]</text>
  </g>

  <!-- Table 3: SRC_WorkOn -->
  <g transform="translate(480, 456)">
    <rect width="240" height="108" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="2.5"/>
    <path d="M 0 0 L 240 0 L 240 36 L 0 36 Z" fill="#a855f7"/>
    <text x="120" y="23" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">SRC_WorkOn</text>
    
    <rect x="0" y="36" width="240" height="36" fill="#3b0764"/>
    <text x="12" y="59" fill="#f0abfc" font-size="12" font-weight="bold">🔑🔗 Emp_ID [PK, FK]</text>
    
    <rect x="0" y="72" width="240" height="36" fill="#3b0764"/>
    <text x="12" y="95" fill="#f0abfc" font-size="12" font-weight="bold">🔑🔗 Project_ID [PK, FK]</text>
  </g>

  <!-- Table 4: SRC_Project -->
  <g transform="translate(880, 444)">
    <rect width="240" height="144" rx="8" fill="#1e293b" stroke="#0ea5e9" stroke-width="2.5"/>
    <path d="M 0 0 L 240 0 L 240 36 L 0 36 Z" fill="#0ea5e9"/>
    <text x="120" y="23" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">SRC_Project</text>
    
    <rect x="0" y="36" width="240" height="36" fill="#1e1b4b"/>
    <text x="12" y="59" fill="#c7d2fe" font-size="12" font-weight="bold">🔑 Project_ID [PK]</text>
    
    <rect x="0" y="72" width="240" height="36" fill="#0f172a"/>
    <text x="24" y="95" fill="#e2e8f0" font-size="12">Project_Name</text>
    
    <rect x="0" y="108" width="240" height="36" fill="#1e293b"/>
    <text x="24" y="131" fill="#e2e8f0" font-size="12">Project_Code</text>
  </g>
</svg>
