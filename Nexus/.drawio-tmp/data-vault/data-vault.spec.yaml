meta:
  theme: tech-blue
  layout: hierarchical
  canvas: auto
  title: Data Vault 2.0 at Nexus (Silver Layer, Worked Example)

nodes:
  # ---------------- Citizen Hub ----------------
  - id: citizenHubHeader
    label: "CITIZEN HUB"
    type: process
    bounds: { x: 40, y: 40, width: 240, height: 32 }
    style:
      fillColor: "#00796B"
      strokeColor: "#00594E"
      fontColor: "#FFFFFF"
      fontStyle: 1
      fontSize: 13
      align: center
      verticalAlign: middle

  - id: citizenHubBody
    label: "citizen_hub_key (PK)\ncitizen_bk (business key)\nload_date\nrecord_source"
    type: process
    bounds: { x: 40, y: 72, width: 240, height: 92 }
    style:
      fillColor: "#E0F2F1"
      strokeColor: "#00796B"
      fontColor: "#004D40"
      fontSize: 11
      align: left
      verticalAlign: top
      spacingLeft: 10
      spacingTop: 8

  # ---------------- Address Hub ----------------
  - id: addressHubHeader
    label: "ADDRESS HUB"
    type: process
    bounds: { x: 640, y: 40, width: 240, height: 32 }
    style:
      fillColor: "#00796B"
      strokeColor: "#00594E"
      fontColor: "#FFFFFF"
      fontStyle: 1
      fontSize: 13
      align: center
      verticalAlign: middle

  - id: addressHubBody
    label: "address_hub_key (PK)\naddress_bk (business key)\nload_date\nrecord_source"
    type: process
    bounds: { x: 640, y: 72, width: 240, height: 92 }
    style:
      fillColor: "#E0F2F1"
      strokeColor: "#00796B"
      fontColor: "#004D40"
      fontSize: 11
      align: left
      verticalAlign: top
      spacingLeft: 10
      spacingTop: 8

  # ---------------- Citizen-Address Link ----------------
  - id: linkHeader
    label: "CITIZEN_ADDRESS LINK"
    type: process
    bounds: { x: 340, y: 264, width: 240, height: 32 }
    style:
      fillColor: "#EF6C00"
      strokeColor: "#B34C00"
      fontColor: "#FFFFFF"
      fontStyle: 1
      fontSize: 13
      align: center
      verticalAlign: middle

  - id: linkBody
    label: "link_key (PK)\ncitizen_hub_key (FK)\naddress_hub_key (FK)\nload_date\nrecord_source"
    type: process
    bounds: { x: 340, y: 296, width: 240, height: 108 }
    style:
      fillColor: "#FFF3E0"
      strokeColor: "#EF6C00"
      fontColor: "#E65100"
      fontSize: 11
      align: left
      verticalAlign: top
      spacingLeft: 10
      spacingTop: 8

  # ---------------- Citizen Satellite ----------------
  - id: citizenSatHeader
    label: "CITIZEN SATELLITE"
    type: process
    bounds: { x: 40, y: 520, width: 240, height: 32 }
    style:
      fillColor: "#6A1B9A"
      strokeColor: "#4A148C"
      fontColor: "#FFFFFF"
      fontStyle: 1
      fontSize: 13
      align: center
      verticalAlign: middle

  - id: citizenSatBody
    label: "citizen_hub_key (FK)\nname\ndate_of_birth\nload_date\nrecord_source"
    type: process
    bounds: { x: 40, y: 552, width: 240, height: 108 }
    style:
      fillColor: "#F3E5F5"
      strokeColor: "#6A1B9A"
      fontColor: "#4A148C"
      fontSize: 11
      align: left
      verticalAlign: top
      spacingLeft: 10
      spacingTop: 8

  # ---------------- Link Satellite (Residency) ----------------
  - id: linkSatHeader
    label: "LINK SATELLITE (RESIDENCY)"
    type: process
    bounds: { x: 340, y: 520, width: 240, height: 32 }
    style:
      fillColor: "#6A1B9A"
      strokeColor: "#4A148C"
      fontColor: "#FFFFFF"
      fontStyle: 1
      fontSize: 13
      align: center
      verticalAlign: middle

  - id: linkSatBody
    label: "link_key (FK)\nvalid_from\nload_date\nrecord_source"
    type: process
    bounds: { x: 340, y: 552, width: 240, height: 92 }
    style:
      fillColor: "#F3E5F5"
      strokeColor: "#6A1B9A"
      fontColor: "#4A148C"
      fontSize: 11
      align: left
      verticalAlign: top
      spacingLeft: 10
      spacingTop: 8

  # ---------------- Address Satellite ----------------
  - id: addressSatHeader
    label: "ADDRESS SATELLITE"
    type: process
    bounds: { x: 640, y: 520, width: 240, height: 32 }
    style:
      fillColor: "#6A1B9A"
      strokeColor: "#4A148C"
      fontColor: "#FFFFFF"
      fontStyle: 1
      fontSize: 13
      align: center
      verticalAlign: middle

  - id: addressSatBody
    label: "address_hub_key (FK)\nstreet\ncity\nload_date\nrecord_source"
    type: process
    bounds: { x: 640, y: 552, width: 240, height: 108 }
    style:
      fillColor: "#F3E5F5"
      strokeColor: "#6A1B9A"
      fontColor: "#4A148C"
      fontSize: 11
      align: left
      verticalAlign: top
      spacingLeft: 10
      spacingTop: 8

  # ---------------- Legend ----------------
  - id: legendHub
    label: "Hub — business key anchor"
    type: text
    bounds: { x: 40, y: 700, width: 260, height: 24 }
    style:
      fontColor: "#00594E"
      fontStyle: 1
      fontSize: 12
      align: left
      verticalAlign: middle

  - id: legendLink
    label: "Link — relationship between Hubs"
    type: text
    bounds: { x: 340, y: 700, width: 280, height: 24 }
    style:
      fontColor: "#B34C00"
      fontStyle: 1
      fontSize: 12
      align: left
      verticalAlign: middle

  - id: legendSat
    label: "Satellite — time-versioned, insert-only descriptive data"
    type: text
    bounds: { x: 640, y: 700, width: 420, height: 24 }
    style:
      fontColor: "#4A148C"
      fontStyle: 1
      fontSize: 12
      align: left
      verticalAlign: middle

edges:
  - from: citizenHubBody
    to: linkHeader
    type: primary
    style:
      exitX: 1
      exitY: 0.5
      entryX: 0
      entryY: 0.5

  - from: addressHubBody
    to: linkHeader
    type: primary
    style:
      exitX: 0
      exitY: 0.5
      entryX: 1
      entryY: 0.5

  - from: linkBody
    to: linkSatHeader
    type: primary
    style:
      exitX: 0.5
      exitY: 1
      entryX: 0.5
      entryY: 0

  - from: citizenHubBody
    to: citizenSatHeader
    type: primary
    style:
      exitX: 0.5
      exitY: 1
      entryX: 0.5
      entryY: 0

  - from: addressHubBody
    to: addressSatHeader
    type: primary
    style:
      exitX: 0.5
      exitY: 1
      entryX: 0.5
      entryY: 0
